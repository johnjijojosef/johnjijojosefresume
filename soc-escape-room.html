<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXUS FINANCIAL // SOC-7 Incident Response</title>
<style>
  :root {
    --bg: #020617;
    --panel: #0f172a;
    --panel-2: #111c30;
    --border: #1e293b;
    --border-hover: #334155;
    --text: #e2e8f0;
    --muted: #64748b;
    --muted-2: #475569;
    --amber: #f59e0b;
    --amber-dim: rgba(245,158,11,0.12);
    --cyan: #0891b2;
    --cyan-hover: #0e7490;
    --red: #ef4444;
    --red-dim: rgba(239,68,68,0.12);
    --emerald: #10b981;
    --emerald-dim: rgba(16,185,129,0.12);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "SF Mono", "Fira Code", Consolas, Menlo, monospace;
    min-height: 100vh;
  }
  .header {
    position: sticky; top: 0; z-index: 10;
    background: rgba(15,23,42,0.9);
    border-bottom: 1px solid var(--border);
    backdrop-filter: blur(6px);
  }
  .header-inner {
    max-width: 1100px; margin: 0 auto;
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px;
  }
  .brand { display: flex; align-items: center; gap: 8px; }
  .brand-title { font-size: 13px; font-weight: 700; letter-spacing: 0.1em; }
  .brand-sub { font-size: 10px; color: var(--muted); letter-spacing: 0.05em; }
  .timer { font-size: 26px; font-weight: 700; color: var(--emerald); font-variant-numeric: tabular-nums; }
  .timer.critical { color: var(--red); animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
  .meter-track { height: 6px; width: 100%; background: var(--border); }
  .meter-fill { height: 100%; transition: width 1s linear, background 0.5s; }
  .meter-label {
    max-width: 1100px; margin: 0 auto; padding: 4px 16px 6px;
    font-size: 10px; color: var(--muted); letter-spacing: 0.05em;
  }
  .layout {
    max-width: 1100px; margin: 0 auto; padding: 16px;
    display: grid; grid-template-columns: 1fr 320px; gap: 16px;
  }
  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; }
  }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 20px; }
  .panel.tight { padding: 12px; }
  h1.title { font-size: 17px; font-weight: 700; letter-spacing: 0.03em; margin: 0; }
  .stage-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .stage-head-left { display: flex; align-items: center; gap: 8px; }
  .stage-title { font-size: 13px; font-weight: 700; letter-spacing: 0.08em; }
  .stage-n { font-size: 10px; color: var(--muted); border: 1px solid var(--border-hover); border-radius: 5px; padding: 2px 8px; letter-spacing: 0.05em; }
  p.desc { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0 0 16px; }
  .icon { width: 20px; height: 20px; flex-shrink: 0; }
  .icon-sm { width: 14px; height: 14px; flex-shrink: 0; }

  .item-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
  .item-btn {
    text-align: left; font-size: 13px; padding: 10px 12px; border-radius: 7px;
    border: 1px solid var(--border); background: var(--panel-2); color: #cbd5e1;
    cursor: pointer; transition: border-color 0.15s, background 0.15s; font-family: inherit;
  }
  .item-btn:hover { border-color: var(--border-hover); }
  .item-btn.selected { border-color: var(--amber); background: var(--amber-dim); color: #fcd34d; }
  .item-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  table.logtable { width: 100%; border-collapse: collapse; font-size: 12px; }
  .logtable-wrap { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin-bottom: 16px; overflow-x: auto; }
  table.logtable thead { background: var(--panel-2); color: var(--muted); text-align: left; }
  table.logtable th { padding: 8px 12px; font-weight: 400; }
  table.logtable td { padding: 8px 12px; color: #cbd5e1; border-top: 1px solid var(--border); }
  table.logtable tr { cursor: pointer; }
  table.logtable tbody tr:hover { background: var(--panel-2); }
  table.logtable tbody tr.selected { background: var(--amber-dim); }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
  @media (max-width: 520px) { .grid2 { grid-template-columns: 1fr; } }
  .opt-btn {
    text-align: left; padding: 10px 12px; border-radius: 7px; border: 1px solid var(--border);
    background: var(--panel-2); cursor: pointer; font-family: inherit; color: inherit;
  }
  .opt-btn:hover { border-color: var(--border-hover); }
  .opt-btn.selected { border-color: var(--amber); background: var(--amber-dim); }
  .opt-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .opt-title { font-weight: 700; font-size: 13px; color: #f1f5f9; }
  .opt-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }

  .chip-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; min-height: 34px; }
  .chip { font-size: 11px; padding: 6px 10px; border-radius: 6px; font-weight: 700; }
  .chip.amber { border: 1px solid var(--amber); background: var(--amber-dim); color: #fcd34d; }
  .chip.red { border: 1px solid var(--red); background: var(--red-dim); color: #fca5a5; }

  .msg { display: flex; align-items: flex-start; gap: 8px; font-size: 13px; padding: 10px 12px; border-radius: 7px; margin-top: 12px; }
  .msg.ok { border: 1px solid #065f46; background: var(--emerald-dim); color: #6ee7b7; }
  .msg.bad { border: 1px solid #7f1d1d; background: var(--red-dim); color: #fca5a5; }

  .btn-row { display: flex; align-items: center; gap: 12px; margin-top: 12px; flex-wrap: wrap; }
  .btn { border: none; font-family: inherit; font-weight: 700; font-size: 13px; padding: 10px 18px; border-radius: 7px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: background 0.15s, opacity 0.15s; }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .btn-amber { background: var(--amber); color: #1c1917; }
  .btn-amber:hover:not(:disabled) { background: #d97706; }
  .btn-cyan { background: var(--cyan); color: #fff; }
  .btn-cyan:hover:not(:disabled) { background: var(--cyan-hover); }
  .btn-emerald { background: var(--emerald); color: #052e1f; }
  .btn-emerald:hover:not(:disabled) { background: #059669; }
  .btn-red { background: var(--red); color: #fff; }
  .btn-red:hover:not(:disabled) { background: #dc2626; }
  .btn-outline { background: transparent; border: 1px solid var(--border-hover); color: #cbd5e1; }
  .btn-outline:hover:not(:disabled) { border-color: #64748b; }

  .hint-wrap { display: flex; flex-direction: column; gap: 6px; }
  .hint-btn { font-size: 12px; border: 1px solid var(--border-hover); background: transparent; color: var(--muted); padding: 9px 12px; border-radius: 7px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-family: inherit; }
  .hint-btn:hover:not(:disabled) { border-color: #b45309; color: var(--amber); }
  .hint-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .hint-text { font-size: 11px; color: #fbbf24; max-width: 340px; opacity: 0.85; }

  .side-label { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 10px; }
  .frag-item { font-size: 11px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px; padding: 7px 9px; margin-bottom: 6px; }
  .frag-code { color: var(--amber); font-weight: 700; }
  .frag-label { color: var(--muted); }
  .empty-note { font-size: 11px; color: #334155; }

  .log-scroll { max-height: 420px; overflow-y: auto; padding-right: 4px; }
  .log-line { font-size: 10.5px; line-height: 1.5; color: var(--muted); margin-bottom: 5px; }
  .log-time { color: #334155; }

  .end-icon { margin-bottom: 6px; }
</style>
</head>
<body>

  <div class="header">
    <div class="header-inner">
      <div class="brand">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2"><path d="M12 2 4 5v6c0 5 3.5 9 8 11 4.5-2 8-6 8-11V5l-8-3Z"/></svg>
        <div>
          <div class="brand-title">NEXUS FINANCIAL // SOC-7</div>
          <div class="brand-sub">INCIDENT #NX-2286 — INTERNAL USE ONLY</div>
        </div>
      </div>
      <div class="timer" id="timer">30:00</div>
    </div>
    <div class="meter-track"><div class="meter-fill" id="meter" style="width:0%; background:#f59e0b;"></div></div>
    <div class="meter-label" id="meter-label">SYSTEM COMPROMISE: 0%</div>
  </div>

  <div class="layout">
    <div id="main-panel" class="panel"></div>
    <div style="display:flex; flex-direction:column; gap:16px;">
      <div class="panel tight">
        <div class="side-label">
          <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          FRAGMENTS
        </div>
        <div id="frag-list"><div class="empty-note">None recovered yet.</div></div>
      </div>
      <div class="panel tight" style="flex:1; min-height:240px;">
        <div class="side-label">
          <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
          SOC LOG
        </div>
        <div class="log-scroll" id="log-list"><div class="empty-note">Awaiting session start…</div></div>
      </div>
    </div>
  </div>

<script>
  const TOTAL_SECONDS = 30 * 60;

  const EMAIL_ITEMS = [
    { id: 0, text: 'Sender: "IT-Support@nexuscorp-secure.net"', flag: true },
    { id: 1, text: 'Subject: "URGENT: Password Expires in 1 Hour — Verify Now"', flag: true },
    { id: 2, text: 'Greeting: "Dear Valued Employee,"', flag: true },
    { id: 3, text: 'Footer: "Nexus Financial IT Help Desk, ext. 4420"', flag: false },
    { id: 4, text: 'Link: "http://nexuscorp.verify-account.xyz/reset"', flag: true },
    { id: 5, text: 'Sent: Tuesday, 9:41 AM', flag: false },
    { id: 6, text: 'Attachment: "invoice_8847.exe.pdf"', flag: true },
  ];
  const EMAIL_CORRECT = new Set(EMAIL_ITEMS.filter(i => i.flag).map(i => i.id));

  const LOG_ROWS = [
    { time: "08:52:11", user: "r.chen",     ip: "10.0.4.22 (internal)",     action: "Login Success" },
    { time: "09:03:45", user: "a.osei",     ip: "10.0.4.31 (internal)",     action: "File Access — Q3_budget.xlsx" },
    { time: "09:15:02", user: "j.martinez", ip: "10.0.4.19 (internal)",     action: "Login Success" },
    { time: "11:47:33", user: "k.wong",     ip: "10.0.4.8 (internal)",      action: "VPN Connect" },
    { time: "13:22:10", user: "a.osei",     ip: "10.0.4.31 (internal)",     action: "Logout" },
    { time: "03:14:07", user: "j.martinez", ip: "185.220.101.47 (Romania)", action: "Login Success", anomaly: true },
    { time: "14:05:19", user: "r.chen",     ip: "10.0.4.22 (internal)",     action: "Print Job" },
    { time: "16:58:02", user: "k.wong",     ip: "10.0.4.8 (internal)",      action: "VPN Disconnect" },
  ];

  const MALWARE_OPTIONS = [
    { id: "emotet", label: "Emotet", sub: "Modular banking trojan / loader" },
    { id: "lockbit", label: "LockBit", sub: "Ransomware-as-a-service" },
    { id: "mirai", label: "Mirai", sub: "IoT botnet malware" },
    { id: "zeus", label: "Zeus", sub: "Credential-stealing banking trojan" },
  ];
  const MALWARE_CORRECT = "lockbit";

  const IR_STEPS_CORRECT = ["Identify", "Contain", "Eradicate", "Recover", "Lessons Learned"];
  const IR_STEPS_SHUFFLED = ["Contain", "Lessons Learned", "Identify", "Recover", "Eradicate"];

  const FRAGMENTS = {
    email:   { code: "SB-7", severity: 6.1, label: "Spoofed Sender Block" },
    logs:    { code: "IA-3", severity: 8.8, label: "Impossible Access" },
    malware: { code: "RW-9", severity: 9.8, label: "Ransomware Signature" },
    ir:      { code: "CR-2", severity: 4.3, label: "Containment Ready" },
  };
  const FINAL_ORDER = ["malware", "logs", "email", "ir"];

  let state = {
    stage: "brief",
    secondsLeft: TOTAL_SECONDS,
    running: false,
    timerId: null,
    log: [],
    collected: [],
    hintsUsed: {},
    emailSel: new Set(),
    emailMsg: null,
    logSel: null,
    logMsg: null,
    malwareSel: null,
    malwareMsg: null,
    irBuilt: [],
    irMsg: null,
    finalBuilt: [],
    finalMsg: null,
  };

  function fmtTime(s) {
    const m = Math.floor(s / 60).toString().padStart(2, "0");
    const sec = (s % 60).toString().padStart(2, "0");
    return m + ":" + sec;
  }

  function pushLog(msg) {
    state.log.unshift({ msg, t: fmtTime(state.secondsLeft) });
    if (state.log.length > 60) state.log.pop();
    renderLog();
  }

  function penalize(seconds, reason) {
    state.secondsLeft = Math.max(0, state.secondsLeft - seconds);
    pushLog("[-" + seconds + "s] " + reason);
    renderTimer();
  }

  function collect(key) {
    if (!state.collected.includes(key)) state.collected.push(key);
    const f = FRAGMENTS[key];
    pushLog("[+] Fragment recovered: " + f.code + " — " + f.label + " (sev " + f.severity + ")");
    renderFrags();
  }

  function tick() {
    if (!state.running) return;
    if (state.secondsLeft <= 0) {
      state.running = false;
      clearTimeout(state.timerId);
      pushLog("!! CONNECTION TO NEXUS-CORE LOST — INTRUSION COMPLETE.");
      state.stage = "lose";
      renderMain();
      return;
    }
    state.secondsLeft -= 1;
    renderTimer();
    state.timerId = setTimeout(tick, 1000);
  }

  function renderTimer() {
    const pct = Math.min(100, ((TOTAL_SECONDS - state.secondsLeft) / TOTAL_SECONDS) * 100);
    const timerEl = document.getElementById("timer");
    timerEl.textContent = fmtTime(state.secondsLeft);
    timerEl.classList.toggle("critical", state.secondsLeft <= 120);
    const meter = document.getElementById("meter");
    meter.style.width = pct + "%";
    meter.style.background = pct < 40 ? "#f59e0b" : pct < 75 ? "#ea580c" : "#dc2626";
    document.getElementById("meter-label").textContent = "SYSTEM COMPROMISE: " + pct.toFixed(0) + "%";
  }

  function renderFrags() {
    const el = document.getElementById("frag-list");
    if (state.collected.length === 0) {
      el.innerHTML = '<div class="empty-note">None recovered yet.</div>';
      return;
    }
    el.innerHTML = state.collected.map(k =>
      '<div class="frag-item"><span class="frag-code">' + FRAGMENTS[k].code + '</span><span class="frag-label"> — ' + FRAGMENTS[k].label + '</span></div>'
    ).join("");
  }

  function renderLog() {
    const el = document.getElementById("log-list");
    if (state.log.length === 0) {
      el.innerHTML = '<div class="empty-note">Awaiting session start…</div>';
      return;
    }
    el.innerHTML = state.log.map(l =>
      '<div class="log-line"><span class="log-time">[' + l.t + ']</span> ' + l.msg + '</div>'
    ).join("");
  }

  function msgHtml(msg) {
    if (!msg) return "";
    const cls = msg.ok ? "ok" : "bad";
    const icon = msg.ok
      ? '<svg class="icon-sm" style="margin-top:2px" viewBox="0 0 24 24" fill="none" stroke="#6ee7b7" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>'
      : '<svg class="icon-sm" style="margin-top:2px" viewBox="0 0 24 24" fill="none" stroke="#fca5a5" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>';
    return '<div class="msg ' + cls + '">' + icon + '<span>' + msg.text + '</span></div>';
  }

  function hintHtml(stageKey, text) {
    const used = !!state.hintsUsed[stageKey];
    const shown = state["hintShow_" + stageKey];
    return '<div class="hint-wrap">' +
      '<button class="hint-btn" ' + (used ? "disabled" : "") + ' onclick="useHint(\'' + stageKey + '\')">' +
      '<svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>' +
      (used ? "Hint used" : "Hint (–60s)") + '</button>' +
      (shown ? '<div class="hint-text">' + text + '</div>' : "") +
      '</div>';
  }

  function useHint(stageKey) {
    if (state.hintsUsed[stageKey]) return;
    state.hintsUsed[stageKey] = true;
    state["hintShow_" + stageKey] = true;
    penalize(60, "Hint requested — Lead " + stageKey);
    renderMain();
  }

  function beginResponse() {
    state.running = true;
    state.stage = 1;
    pushLog("SIEM session initiated. Clock started.");
    pushLog("Lead 1 assigned: suspicious email flagged by three employees.");
    renderMain();
    tick();
  }

  // ---- Puzzle 1 ----
  function toggleEmail(id) {
    if (state.emailSel.has(id)) state.emailSel.delete(id); else state.emailSel.add(id);
    renderMain();
  }
  function submitEmail() {
    const sel = state.emailSel;
    const match = sel.size === EMAIL_CORRECT.size && [...sel].every(id => EMAIL_CORRECT.has(id));
    if (match) {
      state.emailMsg = { ok: true, text: "Correct. All red flags identified — this is a phishing lure." };
      collect("email");
      renderMain();
      setTimeout(() => { state.stage = 2; pushLog("Lead 2 assigned: overnight authentication logs."); renderMain(); }, 1200);
    } else {
      state.emailMsg = { ok: false, text: "Not quite. Re-check the sender, subject, greeting, link, and attachment." };
      penalize(15, "Incorrect phishing triage submitted.");
      renderMain();
    }
  }

  // ---- Puzzle 2 ----
  function selectLog(i) { state.logSel = i; renderMain(); }
  function submitLog() {
    if (state.logSel === null) return;
    if (LOG_ROWS[state.logSel].anomaly) {
      state.logMsg = { ok: true, text: "Correct. j.martinez is on approved leave — this login shouldn't exist." };
      collect("logs");
      renderMain();
      setTimeout(() => { state.stage = 3; pushLog("Lead 3 assigned: malware sample pulled from the affected host."); renderMain(); }, 1200);
    } else {
      state.logMsg = { ok: false, text: "That entry checks out. Look for a login that contradicts what you know about the user." };
      penalize(15, "Wrong log entry flagged.");
      renderMain();
    }
  }

  // ---- Puzzle 3 ----
  function selectMalware(id) { state.malwareSel = id; renderMain(); }
  function submitMalware() {
    if (!state.malwareSel) return;
    if (state.malwareSel === MALWARE_CORRECT) {
      state.malwareMsg = { ok: true, text: "Correct. File-encryption plus a ransom note plus C2 beaconing is LockBit's signature." };
      collect("malware");
      renderMain();
      setTimeout(() => { state.stage = 4; pushLog("Lead 4 assigned: build the containment sequence."); renderMain(); }, 1200);
    } else {
      state.malwareMsg = { ok: false, text: "That family doesn't match this behavior. Re-read the clue." };
      penalize(15, "Wrong malware family selected.");
      renderMain();
    }
  }

  // ---- Puzzle 4 ----
  function pickIr(step) {
    if (state.irBuilt.includes(step)) return;
    state.irBuilt.push(step);
    if (state.irBuilt.length === IR_STEPS_CORRECT.length) {
      const correct = state.irBuilt.every((s, i) => s === IR_STEPS_CORRECT[i]);
      if (correct) {
        state.irMsg = { ok: true, text: "Correct sequence. Containment protocol staged." };
        collect("ir");
        renderMain();
        setTimeout(() => { state.stage = "final"; pushLog("All leads cleared. Assemble the kill-switch."); renderMain(); }, 1200);
      } else {
        state.irMsg = { ok: false, text: "Wrong order — that's not the standard incident response sequence." };
        penalize(15, "Incorrect containment sequence.");
        renderMain();
        setTimeout(() => { state.irBuilt = []; renderMain(); }, 800);
        return;
      }
    }
    renderMain();
  }
  function resetIr() { state.irBuilt = []; state.irMsg = null; renderMain(); }

  // ---- Final ----
  function pickFinal(key) {
    if (state.finalBuilt.includes(key)) return;
    state.finalBuilt.push(key);
    if (state.finalBuilt.length === FINAL_ORDER.length) {
      const correct = state.finalBuilt.every((k, i) => k === FINAL_ORDER[i]);
      if (correct) {
        state.finalMsg = { ok: true, text: "Kill-switch executed. Attacker session terminated." };
        state.running = false;
        clearTimeout(state.timerId);
        pushLog(">> KILL-SWITCH EXECUTED. NETWORK SECURED.");
        renderMain();
        setTimeout(() => { state.stage = "win"; renderMain(); }, 1000);
      } else {
        state.finalMsg = { ok: false, text: "Wrong sequence — arrange fragments by severity, highest first." };
        penalize(20, "Kill-switch sequence rejected.");
        renderMain();
        setTimeout(() => { state.finalBuilt = []; state.finalMsg = null; renderMain(); }, 900);
        return;
      }
    }
    renderMain();
  }

  function restart() {
    clearTimeout(state.timerId);
    state = {
      stage: "brief", secondsLeft: TOTAL_SECONDS, running: false, timerId: null,
      log: [], collected: [], hintsUsed: {},
      emailSel: new Set(), emailMsg: null,
      logSel: null, logMsg: null,
      malwareSel: null, malwareMsg: null,
      irBuilt: [], irMsg: null,
      finalBuilt: [], finalMsg: null,
    };
    renderTimer();
    renderFrags();
    renderLog();
    renderMain();
  }

  function renderMain() {
    const el = document.getElementById("main-panel");
    const s = state.stage;

    if (s === "brief") {
      el.innerHTML = `
        <div style="display:flex; align-items:center; gap:8px; margin-bottom:12px;">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2"><path d="M4.9 19.1a10 10 0 1 1 14.2 0"/><circle cx="12" cy="12" r="3"/></svg>
          <h1 class="title">INCIDENT BRIEFING</h1>
        </div>
        <p class="desc" style="color:#cbd5e1; font-size:13px;">
          03:11 AM — automated monitoring flagged unusual activity across three systems at Nexus Financial.
          Initial triage points to an active intrusion. You're the on-call SOC analyst. Clear four leads,
          recover the kill-switch fragments hidden in each one, and lock the network down before the
          attacker finishes exfiltrating client data.
        </p>
        <ul style="font-size:13px; color:#94a3b8; margin:0 0 24px; padding-left:18px; line-height:1.8;">
          <li>30 minutes on the clock, starting when you begin.</li>
          <li>Four leads to clear, in order.</li>
          <li>Wrong submissions cost time. Hints cost more.</li>
        </ul>
        <button class="btn btn-amber" onclick="beginResponse()">
          Begin Response
          <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
        </button>`;
      return;
    }

    if (s === 1) {
      el.innerHTML = `
        <div class="stage-head">
          <div class="stage-head-left">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/></svg>
            <span class="stage-title">LEAD 1 — PHISHING TRIAGE</span>
          </div>
          <span class="stage-n">1 / 4</span>
        </div>
        <p class="desc">Three employees reported this email. Select every element that's a red flag, then submit.</p>
        <div class="item-list">
          ${EMAIL_ITEMS.map(item => `
            <button class="item-btn ${state.emailSel.has(item.id) ? "selected" : ""}" onclick="toggleEmail(${item.id})">${item.text}</button>
          `).join("")}
        </div>
        ${msgHtml(state.emailMsg)}
        <div class="btn-row">
          <button class="btn btn-cyan" onclick="submitEmail()">Flag as Phishing</button>
          ${hintHtml("1", "There are 5 red flags — check the sender's domain against the footer's real company name.")}
        </div>`;
      return;
    }

    if (s === 2) {
      el.innerHTML = `
        <div class="stage-head">
          <div class="stage-head-left">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14a9 3 0 0 0 18 0V5"/><path d="M3 12a9 3 0 0 0 18 0"/></svg>
            <span class="stage-title">LEAD 2 — LOG ANALYSIS</span>
          </div>
          <span class="stage-n">2 / 4</span>
        </div>
        <p class="desc" style="margin-bottom:4px;">Note: badge records show j.martinez is on approved leave, out of office all week.</p>
        <p class="desc">Select the log entry that shouldn't exist.</p>
        <div class="logtable-wrap">
          <table class="logtable">
            <thead><tr><th>TIME</th><th>USER</th><th>SOURCE IP</th><th>ACTION</th></tr></thead>
            <tbody>
              ${LOG_ROWS.map((row, i) => `
                <tr class="${state.logSel === i ? "selected" : ""}" onclick="selectLog(${i})">
                  <td>${row.time}</td><td>${row.user}</td><td>${row.ip}</td><td>${row.action}</td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        </div>
        ${msgHtml(state.logMsg)}
        <div class="btn-row">
          <button class="btn btn-cyan" ${state.logSel === null ? "disabled" : ""} onclick="submitLog()">Flag Entry</button>
          ${hintHtml("2", "Cross-reference the timestamp and location against what you know about j.martinez's whereabouts.")}
        </div>`;
      return;
    }

    if (s === 3) {
      el.innerHTML = `
        <div class="stage-head">
          <div class="stage-head-left">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2"><path d="M8 2 4 6M16 2l4 4"/><path d="M12 4a6 6 0 0 0-6 6v3a6 6 0 0 0 12 0v-3a6 6 0 0 0-6-6Z"/><path d="M4 14h16M4 10h2M18 10h2"/></svg>
            <span class="stage-title">LEAD 3 — MALWARE ID</span>
          </div>
          <span class="stage-n">3 / 4</span>
        </div>
        <div class="desc" style="border:1px solid var(--border); border-radius:8px; padding:12px; background:var(--panel-2); color:#94a3b8;">
          Sample recovered from the affected host. Behavior: encrypts local files and appends a
          <span style="color:#e2e8f0;">.locked</span> extension, drops a ransom note in every directory,
          and beacons to a command server on port 4444.
        </div>
        <div class="grid2">
          ${MALWARE_OPTIONS.map(opt => `
            <button class="opt-btn ${state.malwareSel === opt.id ? "selected" : ""}" onclick="selectMalware('${opt.id}')">
              <div class="opt-title">${opt.label}</div>
              <div class="opt-sub">${opt.sub}</div>
            </button>
          `).join("")}
        </div>
        ${msgHtml(state.malwareMsg)}
        <div class="btn-row">
          <button class="btn btn-cyan" ${!state.malwareSel ? "disabled" : ""} onclick="submitMalware()">Confirm Identification</button>
          ${hintHtml("3", "Encryption plus a ransom note is the giveaway — rule out the loaders and botnets.")}
        </div>`;
      return;
    }

    if (s === 4) {
      el.innerHTML = `
        <div class="stage-head">
          <div class="stage-head-left">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
            <span class="stage-title">LEAD 4 — CONTAINMENT SEQUENCE</span>
          </div>
          <span class="stage-n">4 / 4</span>
        </div>
        <p class="desc">Click the five incident-response phases in the correct order.</p>
        <div class="chip-row">
          ${state.irBuilt.map((st, i) => `<div class="chip amber">${i + 1}. ${st}</div>`).join("")}
        </div>
        <div class="grid2">
          ${IR_STEPS_SHUFFLED.map(step => `
            <button class="opt-btn" ${state.irBuilt.includes(step) ? "disabled" : ""} onclick="pickIr('${step}')">${step}</button>
          `).join("")}
        </div>
        ${msgHtml(state.irMsg)}
        <div class="btn-row">
          <button class="btn btn-outline" onclick="resetIr()">
            <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
            Reset
          </button>
          ${hintHtml("4", "This is the standard NIST cycle: Identify comes first, Lessons Learned comes last.")}
        </div>`;
      return;
    }

    if (s === "final") {
      el.innerHTML = `
        <div class="stage-head">
          <div class="stage-head-left">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2"><circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6M15.5 7.5l3 3L22 7l-3-3"/></svg>
            <span class="stage-title">KILL-SWITCH</span>
          </div>
          <span class="stage-n">FINAL</span>
        </div>
        <p class="desc">All four fragments are recovered. Execute the kill-switch by clicking them in order — <span style="color:#e2e8f0;">highest severity first</span>.</p>
        <div class="chip-row">
          ${state.finalBuilt.map((k, i) => `<div class="chip red">${i + 1}. ${FRAGMENTS[k].code}</div>`).join("")}
        </div>
        <div class="grid2">
          ${state.collected.map(k => `
            <button class="opt-btn" ${state.finalBuilt.includes(k) ? "disabled" : ""} onclick="pickFinal('${k}')">
              <div class="opt-title">${FRAGMENTS[k].code} — ${FRAGMENTS[k].label}</div>
              <div class="opt-sub">Severity ${FRAGMENTS[k].severity}</div>
            </button>
          `).join("")}
        </div>
        ${msgHtml(state.finalMsg)}`;
      return;
    }

    if (s === "win") {
      el.innerHTML = `
        <div style="display:flex; align-items:center; gap:8px; margin-bottom:12px;">
          <svg class="icon" style="width:26px;height:26px;" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2"><path d="M5.8 11.3 2 22l10.7-3.79M4 3h.01M22 8h.01M15 2h.01M22 20h.01M22 2 2 22M8 4l4-2M14 8l2-2M2 14l2-2M6.5 18.5 4 21"/></svg>
          <h1 class="title" style="color:#10b981;">NETWORK SECURED</h1>
        </div>
        <p class="desc">Kill-switch executed with <span style="color:#10b981; font-weight:700;">${fmtTime(state.secondsLeft)}</span> remaining. The attacker's session is terminated and client data stays put.</p>
        <p class="desc" style="color:#475569;">Incident #NX-2286 — closed.</p>
        <button class="btn btn-emerald" onclick="restart()">
          <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
          Run It Again
        </button>`;
      return;
    }

    if (s === "lose") {
      el.innerHTML = `
        <div style="display:flex; align-items:center; gap:8px; margin-bottom:12px;">
          <svg class="icon" style="width:26px;height:26px;" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M8 15s1.5-2 4-2 4 2 4 2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
          <h1 class="title" style="color:#ef4444;">BREACH SUCCESSFUL</h1>
        </div>
        <p class="desc">Time ran out before the kill-switch executed. Client data has left the network.</p>
        <p class="desc" style="color:#475569;">Incident #NX-2286 — escalated to executive team.</p>
        <button class="btn btn-red" onclick="restart()">
          <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
          Try Again
        </button>`;
      return;
    }
  }

  // initial paint
  renderTimer();
  renderFrags();
  renderLog();
  renderMain();
</script>
</body>
</html>
